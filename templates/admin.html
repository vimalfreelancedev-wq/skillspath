{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-4">Admin – Seed Database</h1>
    <p class="text-gray-600 mb-6">This will clear all existing data and repopulate with the predefined seed data.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-yellow-500 text-white py-2 px-6 rounded-md hover:bg-yellow-600 transition-colors">Reload Seed Data</button>
    </form>

    {% if success %}
    <div class="mt-4 p-4 bg-green-100 text-green-800 rounded-md">✅ Database seeded successfully!</div>
    {% endif %}
    {% if error %}
    <div class="mt-4 p-4 bg-red-100 text-red-800 rounded-md">❌ Error: {{ error }}</div>
    {% endif %}
</div>
{% endblock %}

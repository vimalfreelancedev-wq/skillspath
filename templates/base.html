<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillPath - Course Recommendations</title>
    {% load static %}
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom styles (minimal) -->
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'index' %}" class="brand text-2xl font-bold">SkillPath</a>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="{% url 'index' %}" class="text-gray-600 hover:text-indigo-600 font-medium">Home</a></li>
                    <li><a href="{% url 'admin_seed' %}" class="text-gray-600 hover:text-indigo-600 font-medium">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <div class="container mx-auto">
            &copy; 2026 SkillPath
        </div>
    </footer>
    <script src="{% static 'script.js' %}"></script>
</body>
</html>
